# .golangci.yml - Configuration for golangci-lint
# Documentation: https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters-settings:
  govet:
    enable-all: false
  errcheck:
    check-type-assertions: true
    check-blank: false
  gocyclo:
    min-complexity: 20
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - ifElseChain
      - hugeParam
      - paramTypeCombine
      - unnamedResult
      - octalLiteral
      - httpNoBody
      - exitAfterDefer
  gosec:
    excludes:
      - G101 # False positives for token/key string constants
      - G301 # Directory permissions
      - G306 # File permissions
      - G402 # TLS MinVersion in legacy/testing SMTP adapters
  revive:
    ignore-generated-header: true
    severity: warning
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gocritic
    - gofmt
    - goimports
    - gosec
    - misspell
    - revive
    - unconvert
    - whitespace

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-use-default: false
  exclude-rules:
    # Exclude test files from checks that are common in test mocks / table tests
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - gocritic
        - govet
        - staticcheck
    # Exclude deferred Close checks on adapters and migration tools
    - path: internal/(adapters/smtp|pkg/migration)/
      linters:
        - errcheck
